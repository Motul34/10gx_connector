[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toyopuc-10gx"
version = "0.1.1"
description = "Python communication library for JTEKT TOYOPUC 10GX PLC via Ethernet Computer Link"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "calsonic" }
]
keywords = ["plc", "toyopuc", "jtekt", "10gx", "ethernet", "industrial-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/calsonic/10gx_connector"

[tool.hatch.build.targets.wheel]
packages = ["src/toyopuc"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "/docs",
]
